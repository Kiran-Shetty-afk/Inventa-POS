global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "eureka-server"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["eureka-server:8761"]

  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["api-gateway:5000"]

  - job_name: "user-org-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["user-org-service:8081"]

  - job_name: "inventory-catalog-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["inventory-catalog-service:8082"]

  - job_name: "order-sales-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["order-sales-service:8083"]

  - job_name: "billing-analytics-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["billing-analytics-service:8084"]

  - job_name: "ML service"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["ml-intelligence-service:8000"]

