server:
  port: 8084

spring:
  application:
    name: billing-analytics-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:billingdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:#Barcelona10}"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

razorpay:
  api:
    key: ${RAZORPAY_API_KEY:rzp_test_5d6n1E383x3yN6}
    secret: ${RAZORPAY_API_SECRET:iVzQvD4iZ8qPvhf2N4gQ9K5m}

stripe:
  api:
    key: ${STRIPE_API_KEY:sk_test_51Px...}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}

logging:
  level:
    com.zosh: INFO
