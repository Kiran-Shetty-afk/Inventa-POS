server:
  port: 8084

spring:
  application:
    name: billing-analytics-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:billingdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD}"

  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

services:
  order-sales:
    url: ${ORDER_SALES_SERVICE_URL:http://localhost:8083}
  inventory:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  user-org:
    url: ${USER_ORG_SERVICE_URL:http://localhost:8081}
  ml:
    url: ${ML_SERVICE_URL:http://localhost:8000}

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

razorpay:
  api:
    key: ${RAZORPAY_API_KEY}
    secret: ${RAZORPAY_API_SECRET}

stripe:
  api:
    # Stripe is optional; the service still starts and supports Razorpay without it.
    key: ${STRIPE_API_KEY:}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}

logging:
  level:
    com.zosh: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

